name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-and-packages:
    name: Web & TypeScript Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check design JSON Schema parity
        run: pnpm schema:check

      - name: Build and validate service catalog
        run: pnpm catalog:check

      - name: Check price SKU coverage report
        run: pnpm cost:coverage

      - name: Build packages and web app
        run: pnpm build

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit & property tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: pnpm test:e2e

  api-laravel:
    name: Laravel API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infrasim
          POSTGRES_USER: infrasim
          POSTGRES_PASSWORD: infrasim_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U infrasim -d infrasim"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo Node dependencies and build packages
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, xml, curl, zip, redis

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          php artisan key:generate

      - name: Run Postgres migrations
        run: php artisan migrate --force

      - name: Run PHPUnit test suite
        run: php artisan test

      - name: Check Laravel Pint formatting
        run: ./vendor/bin/pint --test
